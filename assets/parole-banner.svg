<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">PAROLE — least privilege for autonomous agents</title>
  <desc id="description">A dark, modern banner showing a protected policy gateway and three decision tiers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101b33"/>
      <stop offset="1" stop-color="#17122e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e0c1"/>
      <stop offset="0.54" stop-color="#71a7ff"/>
      <stop offset="1" stop-color="#c59aff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#6547b4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6547b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb6ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#a8b7e7" stroke-opacity="0.17"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="72" y="58" width="288" height="32" rx="16" fill="#192844" stroke="#60759d" stroke-opacity="0.55"/>
    <circle cx="92" cy="74" r="5" fill="#56e0c1"/>
    <text x="108" y="79" fill="#b9c9e8" font-size="12" font-weight="700" letter-spacing="2.2">AGENT SECURITY · POLICY GATEWAY</text>

    <text x="68" y="184" fill="#f3f6ff" font-size="76" font-weight="800" letter-spacing="4">PAROLE</text>
    <rect x="72" y="211" width="438" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="251" fill="#e1e9fa" font-size="23" font-weight="600">Least privilege for autonomous agents.</text>
    <text x="72" y="286" fill="#9eaccb" font-size="16">Fast local decisions. Careful escalation. Observable policy.</text>

    <g transform="translate(670 79)">
      <path d="M0 64H381M0 154H381M0 244H381" fill="none" stroke="url(#accent)" stroke-opacity="0.26" stroke-width="2"/>

      <g transform="translate(0 26)">
        <rect x="0" y="0" width="188" height="76" rx="17" fill="#111f34" stroke="#56e0c1" stroke-opacity="0.62"/>
        <circle cx="24" cy="24" r="10" fill="#56e0c1" fill-opacity="0.18" stroke="#56e0c1"/>
        <circle cx="24" cy="24" r="3" fill="#56e0c1"/>
        <text x="46" y="29" fill="#61e4c4" font-size="12" font-weight="700" letter-spacing="1.4">TIER 0</text>
        <text x="20" y="57" fill="#e7f2ff" font-size="16" font-weight="600">Local policy cache</text>
      </g>

      <g transform="translate(213 26)">
        <rect x="0" y="0" width="188" height="76" rx="17" fill="#151d38" stroke="#81aaff" stroke-opacity="0.62"/>
        <circle cx="24" cy="24" r="10" fill="#81aaff" fill-opacity="0.17" stroke="#81aaff"/>
        <circle cx="24" cy="24" r="3" fill="#81aaff"/>
        <text x="46" y="29" fill="#9dbaff" font-size="12" font-weight="700" letter-spacing="1.4">TIER 1</text>
        <text x="20" y="57" fill="#e7f2ff" font-size="16" font-weight="600">Typed risk checks</text>
      </g>

      <g transform="translate(106 168)">
        <rect x="0" y="0" width="188" height="76" rx="17" fill="#201b39" stroke="#c59aff" stroke-opacity="0.7"/>
        <circle cx="24" cy="24" r="10" fill="#c59aff" fill-opacity="0.17" stroke="#c59aff"/>
        <circle cx="24" cy="24" r="3" fill="#c59aff"/>
        <text x="46" y="29" fill="#d2afff" font-size="12" font-weight="700" letter-spacing="1.4">TIER 2</text>
        <text x="20" y="57" fill="#f0e9ff" font-size="16" font-weight="600">Optional synthesis</text>
      </g>
    </g>
  </g>
</svg>
