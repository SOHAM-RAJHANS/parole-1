<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">PAROLE — autonomy, within bounds</title>
  <desc id="description">An animated policy gateway visual routes agent actions through a local cache, typed risk checks, and optional NVIDIA synthesis before a decision is returned.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111a"/>
      <stop offset=".58" stop-color="#101a27"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61e6ca"/>
      <stop offset=".55" stop-color="#80a9ff"/>
      <stop offset="1" stop-color="#bf91ff"/>
    </linearGradient>
    <radialGradient id="halo" cx=".77" cy=".4" r=".55">
      <stop offset="0" stop-color="#4d7b87" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4d7b87" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb6ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 5 13; animation: flow 2.8s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .pulse-delay { animation-delay: .8s; }
      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%, 100% { opacity: .46; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.18); } }
      @keyframes scan { 0%, 100% { transform: translateX(0); opacity: .1; } 50% { transform: translateX(670px); opacity: .4; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .scan { animation: none; }
      }
    </style>
  </defs>

  <rect width="1440" height="520" rx="30" fill="url(#background)"/>
  <rect width="1440" height="520" rx="30" fill="url(#halo)"/>
  <rect width="1440" height="520" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="518" rx="29" fill="none" stroke="#a8b7e7" stroke-opacity=".18"/>
  <path d="M48 92H1392M48 428H1392" stroke="#a8b7e7" stroke-opacity=".1"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(82 82)">
      <rect width="280" height="36" rx="18" fill="#17283a" stroke="#4a7887" stroke-opacity=".55"/>
      <circle cx="20" cy="18" r="5" fill="#61e6ca" class="pulse"/>
      <text x="36" y="23" fill="#b9c9e8" font-size="12" font-weight="700" letter-spacing="2">AGENT POLICY GATEWAY</text>
    </g>

    <text x="76" y="235" fill="#f3f6ff" font-size="94" font-weight="800" letter-spacing="7">PAROLE</text>
    <rect x="84" y="262" width="408" height="4" rx="2" fill="url(#signal)"/>
    <text x="84" y="315" fill="#edf4f4" font-size="27" font-weight="650">Autonomy, within bounds.</text>
    <text x="84" y="353" fill="#a6b4c1" font-size="17">Fast local decisions. Careful escalation.</text>
    <text x="84" y="380" fill="#a6b4c1" font-size="17">Every policy decision, made observable.</text>
    <g transform="translate(84 399)">
      <rect width="186" height="31" rx="15.5" fill="#10261f" stroke="#4ac9a9" stroke-opacity=".4"/>
      <circle cx="17" cy="15.5" r="4" fill="#61e6ca"/>
      <text x="30" y="20" fill="#91ebd7" font-size="10" font-weight="700" letter-spacing="1.2">LOCAL-FIRST ROUTING</text>
    </g>

    <g transform="translate(616 105)">
      <rect width="742" height="310" rx="22" fill="#0b121a" fill-opacity=".92" stroke="#6f8599" stroke-opacity=".28"/>
      <rect x="1" y="1" width="740" height="308" rx="21" fill="none" stroke="url(#signal)" stroke-opacity=".14"/>
      <circle cx="25" cy="26" r="4" fill="#ff7b82"/>
      <circle cx="41" cy="26" r="4" fill="#f8c56b"/>
      <circle cx="57" cy="26" r="4" fill="#61e6ca"/>
      <text x="82" y="30" fill="#7f91a1" font-size="10" font-family="Consolas, monospace" letter-spacing="1.5">POLICY ROUTER / LIVE TRACE</text>
      <path d="M22 48H720" stroke="#758699" stroke-opacity=".16"/>

      <text x="34" y="83" fill="#7e919f" font-size="10" font-family="Consolas, monospace" letter-spacing="1.3">INCOMING ACTION</text>
      <rect x="34" y="96" width="674" height="46" rx="10" fill="#111e29" stroke="#61798c" stroke-opacity=".35"/>
      <text x="52" y="124" fill="#c6d3db" font-size="13" font-family="Consolas, monospace">agent.request</text>
      <text x="177" y="124" fill="#61e6ca" font-size="13" font-family="Consolas, monospace">→</text>
      <text x="199" y="124" fill="#a8b7c1" font-size="13" font-family="Consolas, monospace">provenance + taint checks</text>
      <circle cx="677" cy="119" r="4" fill="#61e6ca" class="pulse pulse-delay" filter="url(#softGlow)"/>

      <path d="M369 143V165M153 165H585M153 165V180M369 165V180M585 165V180" fill="none" stroke="#70899a" stroke-opacity=".55"/>
      <path d="M153 165H585" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="5 13" class="flow"/>

      <g transform="translate(34 180)">
        <rect width="211" height="89" rx="12" fill="#10241f" stroke="#61e6ca" stroke-opacity=".62"/>
        <circle cx="23" cy="23" r="8" fill="#61e6ca" fill-opacity=".2" stroke="#61e6ca"/>
        <circle cx="23" cy="23" r="3" fill="#61e6ca"/>
        <text x="42" y="27" fill="#79ead2" font-size="11" font-weight="700" letter-spacing="1.2">TIER 0</text>
        <text x="17" y="55" fill="#e1eeec" font-size="15" font-weight="600">Local policy cache</text>
        <text x="17" y="74" fill="#91aaa4" font-size="10">Instant · zero API calls</text>
      </g>
      <g transform="translate(263 180)">
        <rect width="211" height="89" rx="12" fill="#151d31" stroke="#80a9ff" stroke-opacity=".62"/>
        <circle cx="23" cy="23" r="8" fill="#80a9ff" fill-opacity=".2" stroke="#80a9ff"/>
        <circle cx="23" cy="23" r="3" fill="#80a9ff"/>
        <text x="42" y="27" fill="#a7c0ff" font-size="11" font-weight="700" letter-spacing="1.2">TIER 1</text>
        <text x="17" y="55" fill="#e4ebfa" font-size="15" font-weight="600">Typed risk checks</text>
        <text x="17" y="74" fill="#9ba9c6" font-size="10">Deterministic · local</text>
      </g>
      <g transform="translate(492 180)">
        <rect width="216" height="89" rx="12" fill="#211a30" stroke="#bf91ff" stroke-opacity=".7"/>
        <circle cx="23" cy="23" r="8" fill="#bf91ff" fill-opacity=".2" stroke="#bf91ff"/>
        <circle cx="23" cy="23" r="3" fill="#bf91ff"/>
        <text x="42" y="27" fill="#d0adff" font-size="11" font-weight="700" letter-spacing="1.2">TIER 2</text>
        <text x="17" y="55" fill="#f0e9fa" font-size="15" font-weight="600">NVIDIA synthesis</text>
        <text x="17" y="74" fill="#b2a1c7" font-size="10">Optional · guarded · bounded</text>
      </g>

      <path d="M34 288H708" stroke="url(#signal)" stroke-opacity=".55" stroke-width="1"/>
      <path d="M35 48V288" stroke="#61e6ca" stroke-opacity=".42" stroke-width="2" class="scan"/>
      <text x="34" y="301" fill="#758a99" font-size="9" font-family="Consolas, monospace">VALIDATE LOCALLY</text>
      <text x="585" y="301" fill="#91ebd7" font-size="9" font-family="Consolas, monospace" text-anchor="end">DECISION → EVENT STREAM</text>
    </g>
  </g>
</svg>
