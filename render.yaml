services:
  - type: web
    name: parole-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEBIUS_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
